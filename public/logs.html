<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 Logs · Bot Absensi Pusaka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container workspace-page">
      <header class="topbar dashboard-topbar">
        <a class="app-title" href="/dashboard.html">
          <span class="brand-emoji" aria-hidden="true">🤖</span>
          <span>Bot Absensi Pusaka</span>
        </a>
        <div class="topbar-actions">
          <nav class="nav-links" aria-label="Navigasi utama">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/users.html">Users</a>
            <a class="active" href="/logs.html">Logs</a>
            <form class="logout-form" method="post" action="/auth/logout">
              <button class="nav-logout" type="submit">Logout</button>
            </form>
          </nav>
        </div>
      </header>

      <main>
        <section class="page-header ops-card">
          <h1>Logs</h1>
          <button id="refresh-logs" class="btn secondary" type="button">Refresh</button>
        </section>

        <section class="filters ops-card" aria-label="Filter log">
          <label>
            <span>Status</span>
            <select id="status-filter">
              <option value="all">Semua</option>
              <option value="success">Success</option>
              <option value="failed">Failed</option>
              <option value="skipped">Skipped</option>
            </select>
          </label>
          <label>
            <span>Tipe</span>
            <select id="type-filter">
              <option value="all">Semua</option>
              <option value="masuk">Masuk</option>
              <option value="pulang">Pulang</option>
            </select>
          </label>
          <label class="search-field">
            <span>Cari</span>
            <input type="search" id="log-search" placeholder="Nickname atau pesan" />
          </label>
        </section>

        <section class="panel table-panel ops-card">
          <div class="table-meta">
            <p id="logs-summary" class="muted">Memuat...</p>
          </div>
          <div class="table-wrapper">
            <table class="data-table logs-table">
              <thead>
                <tr>
                  <th>Waktu</th>
                  <th>Nickname</th>
                  <th>Tipe</th>
                  <th>Status</th>
                  <th>Pesan</th>
                </tr>
              </thead>
              <tbody id="logs"></tbody>
            </table>
          </div>
          <div class="pagination" aria-label="Paginasi logs">
            <button id="logs-prev" class="btn secondary" type="button">Prev</button>
            <span id="logs-page-info">-</span>
            <button id="logs-next" class="btn secondary" type="button">Next</button>
          </div>
        </section>
      </main>
      <footer class="page-footer">
        <small>&copy; 2026 Bot Absensi Pusaka &middot; Created by @bangisa</small>
      </footer>
    </div>

    <script type="module" src="/js/logs.js"></script>
      <script type="module" src="/js/auth-ui.js"></script>
  </body>
</html>
