<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 Users · Bot Absensi Pusaka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a class="app-title" href="/">
          <span class="brand-emoji" aria-hidden="true">🤖</span>
          <span>Bot Absensi Pusaka</span>
        </a>
        <nav class="nav-links" aria-label="Navigasi utama">
          <a href="/">Dashboard</a>
          <a class="active" href="/users.html">Users</a>
          <a href="/logs.html">Logs</a>
          <form class="logout-form" method="post" action="/auth/logout">
            <button class="nav-logout" type="submit">Logout</button>
          </form>
        </nav>
      </header>

      <main>
        <section class="page-header">
          <div class="users-heading">
            <h1>Users</h1>
            <p id="users-summary" class="muted">Memuat...</p>
          </div>
          <button id="open-user-modal" class="btn primary" type="button">
            Tambah User
          </button>
        </section>

        <section class="panel table-panel">
          <div class="table-wrapper">
            <table class="data-table users-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nickname</th>
                  <th>Paket</th>
                  <th>Terpakai</th>
                  <th>Sisa</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="users-list"></tbody>
            </table>
          </div>
          <div class="pagination" aria-label="Paginasi users">
            <button id="users-prev" class="btn secondary" type="button">
              Prev
            </button>
            <span id="users-page-info">-</span>
            <button id="users-next" class="btn secondary" type="button">
              Next
            </button>
          </div>
        </section>
      </main>
    </div>

    <dialog id="user-modal" class="modal">
      <form method="post" id="user-form" class="user-form modal-content">
        <div class="modal-header">
          <h2 id="user-modal-title">Tambah User</h2>
          <button
            id="close-user-modal"
            class="modal-close-icon"
            type="button"
            aria-label="Tutup modal"
            title="Tutup"
          >
            ❌
          </button>
        </div>
        <label>
          <span>Nickname <span class="required-mark">*</span></span>
          <input type="text" id="nickname" autocomplete="nickname" required />
        </label>
        <label>
          <span>Paket Service <span class="required-mark">*</span></span>
          <select id="service-plan" required>
            <option value="1">1 Hari</option>
            <option value="7">7 Hari</option>
            <option value="30">30 Hari</option>
            <option value="90">90 Hari</option>
            <option value="unlimited" selected>Tak Terbatas</option>
          </select>
        </label>
        <label>
          <span>
            Username
            <span class="required-mark" id="username-required">*</span>
            <small class="field-hint" id="username-hint">Akun Pusaka</small>
          </span>
          <input type="text" id="username" autocomplete="username" required />
        </label>
        <label>
          <span
            >Password
            <span class="required-mark" id="password-required">*</span>
            <small class="field-hint" id="password-hint">Akun Pusaka</small>
          </span>
          <input
            type="password"
            id="password"
            autocomplete="new-password"
            required
          />
        </label>
        <label>
          <span>Latitude <span class="required-mark">*</span></span>
          <input type="number" step="any" id="lat" required />
        </label>
        <label>
          <span>Longitude <span class="required-mark">*</span></span>
          <input type="number" step="any" id="lng" required />
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Tambah</button>
          <p id="form-message" class="form-message" aria-live="polite"></p>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/users.js"></script>
    <script type="module" src="/js/auth-ui.js"></script>
  </body>
</html>
