<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot Absensi Pusaka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a class="app-title" href="/">
          <img src="/favicon.svg" alt="" aria-hidden="true" />
          <span>Bot Absensi Pusaka</span>
        </a>
        <nav class="nav-links" aria-label="Navigasi utama">
          <a class="active" href="/">Dashboard</a>
          <a href="/users.html">Users</a>
          <a href="/logs.html">Logs</a>
        </nav>
      </header>

      <main>
        <section class="page-header">
          <h1>Dashboard</h1>
          <div id="scheduler-status" class="status-pill offline">STOPPED</div>
        </section>

        <section class="panel split-panel">
          <div>
            <h2>Scheduler</h2>
            <p id="scheduler-detail" class="muted">Memuat...</p>
          </div>
          <div class="button-group scheduler-actions">
            <button id="start-btn" class="btn primary" type="button">
              Start
            </button>
            <button id="stop-btn" class="btn danger" type="button" hidden>
              Stop
            </button>
          </div>
        </section>

        <p id="dashboard-message" class="notice" hidden></p>

        <section class="health-grid" aria-label="Status sistem">
          <article class="card">
            <span>Generator</span>
            <strong id="generator-status">-</strong>
            <small id="generator-detail">-</small>
          </article>
          <article class="card">
            <span>Queue</span>
            <strong id="queue-status">-</strong>
            <small id="queue-detail">-</small>
          </article>
          <article class="card">
            <span>Browser</span>
            <strong id="browser-status">-</strong>
            <small id="browser-detail">-</small>
          </article>
          <article class="card">
            <span>Memory</span>
            <strong id="memory-status">-</strong>
            <small id="memory-detail">-</small>
          </article>
          <article class="card">
            <span>Total User</span>
            <strong id="total-users-status">-</strong>
            <small id="total-users-detail">Terdaftar</small>
          </article>
          <article class="card">
            <span>Jadwal Masuk</span>
            <strong id="masuk-schedules-status">-</strong>
            <small id="masuk-schedules-detail">-</small>
          </article>
          <article class="card">
            <span>Jadwal Pulang</span>
            <strong id="pulang-schedules-status">-</strong>
            <small id="pulang-schedules-detail">-</small>
          </article>
          <article class="card">
            <span>Uptime</span>
            <strong id="uptime-status">-</strong>
            <small id="uptime-detail">-</small>
          </article>
        </section>
      </main>
    </div>

    <script type="module" src="/js/dashboard.js"></script>
  </body>
</html>
